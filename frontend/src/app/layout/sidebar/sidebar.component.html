<div class="flex h-full flex-col">
  <div class="h-16 px-5 flex items-center border-b border-slate-200">
    <app-logo></app-logo>
  </div>
  <nav class="flex-1 px-3 py-4 space-y-1">
    @for (item of nav; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-indigo-50 text-indigo-700"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50"
      >
        <span class="w-2 h-2 rounded-full bg-slate-300"></span>
        {{ item.label }}
      </a>
    }
  </nav>
  <div class="px-5 py-3 border-t border-slate-200 text-xs text-slate-400">
    v0.1.0 · local
  </div>
</div>
