<div class="flex items-center gap-4 w-full">
  <nav class="flex items-center gap-1 text-sm text-slate-500">
    <span class="text-slate-900 font-medium">Workspace</span>
  </nav>
  <div class="flex-1"></div>
  <div class="relative w-72 hidden md:block">
    <input
      type="text"
      placeholder="Search…"
      class="w-full h-9 pl-9 pr-3 rounded-lg border border-slate-200 bg-slate-50 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500"
    />
    <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>
  <div class="relative">
    <button
      type="button"
      (click)="toggleMenu($event)"
      class="h-9 w-9 rounded-full bg-indigo-100 text-indigo-700 text-sm font-semibold flex items-center justify-center hover:bg-indigo-200"
      [attr.aria-expanded]="menuOpen"
    >
      {{ initials }}
    </button>
    @if (menuOpen) {
      <div
        class="absolute right-0 mt-2 w-48 rounded-lg border border-slate-200 bg-white shadow-lg py-1 z-50"
        (click)="$event.stopPropagation()"
      >
        <div class="px-3 py-2 border-b border-slate-100">
          <p class="text-sm font-medium text-slate-900 truncate">{{ user?.displayName }}</p>
          <p class="text-xs text-slate-500 truncate">{{ user?.email }}</p>
        </div>
        <button
          type="button"
          class="w-full text-left px-3 py-2 text-sm text-slate-600 hover:bg-slate-50"
        >
          Profile
        </button>
        <button
          type="button"
          (click)="signOut()"
          class="w-full text-left px-3 py-2 text-sm text-rose-600 hover:bg-rose-50"
        >
          Sign out
        </button>
      </div>
    }
  </div>
</div>
