<div class="rounded-xl border border-slate-200 bg-white relative overflow-hidden min-h-[500px]">
  <div #graphHost class="absolute inset-0"></div>
  @if (!graph) {
    <div class="absolute inset-0 flex items-center justify-center text-slate-400 text-sm pointer-events-none">
      No graph data yet — run a crawl to populate.
    </div>
  }
  <div class="absolute bottom-3 left-3 bg-white/90 backdrop-blur rounded-lg border border-slate-200 px-3 py-2 text-xs text-slate-600 flex items-center gap-3 pointer-events-none">
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-indigo-600"></span>Entry</span>
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-slate-600"></span>Internal</span>
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-600"></span>Failed</span>
  </div>
</div>
