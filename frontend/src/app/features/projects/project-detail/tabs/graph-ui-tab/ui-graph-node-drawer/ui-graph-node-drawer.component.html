<aside
  class="fixed top-16 right-0 h-[calc(100vh-4rem)] w-96 bg-white border-l border-slate-200 shadow-lg transform transition-transform duration-200 z-40"
  [class.translate-x-0]="node"
  [class.translate-x-full]="!node"
>
  @if (node) {
    <div class="h-full flex flex-col">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 class="text-sm font-semibold text-slate-900">Node detail</h3>
        <button (click)="closed.emit()" class="text-slate-400 hover:text-slate-600">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="px-5 py-4 space-y-4 overflow-y-auto">
        <div>
          <dt class="text-xs font-medium text-slate-500 uppercase tracking-wide">URL</dt>
          <dd class="mt-1 text-sm">
            <a [href]="node.url" target="_blank" rel="noopener" class="text-indigo-600 hover:underline break-all">{{ node.url }}</a>
          </dd>
        </div>
        <div>
          <dt class="text-xs font-medium text-slate-500 uppercase tracking-wide">Title</dt>
          <dd class="mt-1 text-sm text-slate-900">{{ node.label }}</dd>
        </div>
        <div>
          <dt class="text-xs font-medium text-slate-500 uppercase tracking-wide">Forms</dt>
          <dd class="mt-1 text-sm text-slate-700">{{ formsCount }} form(s) detected</dd>
        </div>
        <div>
          <dt class="text-xs font-medium text-slate-500 uppercase tracking-wide">Buttons</dt>
          <dd class="mt-1 text-sm text-slate-700">
            @if (buttons.length === 0) {
              <span class="text-slate-400">none</span>
            } @else {
              <span class="flex flex-wrap gap-1">
                @for (b of buttons; track b) {
                  <span class="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-700">{{ b }}</span>
                }
              </span>
            }
          </dd>
        </div>
        @if (error) {
          <div>
            <dt class="text-xs font-medium text-rose-500 uppercase tracking-wide">Error</dt>
            <dd class="mt-1 text-sm text-rose-700 whitespace-pre-wrap">{{ error }}</dd>
          </div>
        }
        @if (screenshotUrl) {
          <div>
            <dt class="text-xs font-medium text-slate-500 uppercase tracking-wide">Screenshot</dt>
            <dd class="mt-2">
              <img [src]="screenshotUrl" alt="Screenshot" class="w-full rounded-lg border border-slate-200" />
            </dd>
          </div>
        }
      </div>
    </div>
  }
</aside>
