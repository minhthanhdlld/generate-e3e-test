<div class="space-y-4">
  <div class="flex flex-wrap items-center gap-2">
    <button
      type="button"
      (click)="startCrawl()"
      [disabled]="isStarting || isRunInProgress"
      class="h-9 px-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-sm font-medium text-white inline-flex items-center gap-1.5 disabled:opacity-60 disabled:cursor-not-allowed"
    >
      @if (isStarting) {
        <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25"></circle>
          <path d="M12 2a10 10 0 0110 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
        </svg>
      } @else {
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      }
      Run Crawl
    </button>

    @if (runs.length > 0) {
      <select
        class="h-9 pl-3 pr-8 rounded-lg border border-slate-200 bg-white text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/30"
        [(ngModel)]="selectedRunId"
        (change)="onRunDropdownChange()"
      >
        @for (r of runs; track r.id) {
          <option [value]="r.id">{{ r.startedAt | date:'short' }} · {{ r.status }}</option>
        }
      </select>
    }

    <div class="ml-auto flex items-center gap-2 text-xs">
      @if (currentRun) {
        <app-status-pill [status]="currentRun.status"></app-status-pill>
      }
      @if (currentRun?.errorMessage) {
        <span class="text-rose-600 truncate max-w-xs" [attr.title]="currentRun?.errorMessage">{{ currentRun?.errorMessage }}</span>
      }
    </div>
  </div>

  @if (errorMsg) {
    <div class="rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700">{{ errorMsg }}</div>
  }

  <app-ui-graph [graph]="graph" (nodeSelected)="onNodeSelected($event)"></app-ui-graph>

  <app-ui-graph-node-drawer
    [node]="selectedNode"
    [screenshotUrl]="selectedNodeScreenshotUrl"
    (closed)="closeDrawer()"
  ></app-ui-graph-node-drawer>
</div>
